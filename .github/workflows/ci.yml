name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Toolchain
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check legacy Material imports
        run: |
          if grep -R "package:flutter/material.dart" lib example test; then
            echo "Legacy package:flutter/material.dart import found."
            exit 1
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Validate package publication
        run: dart pub publish --dry-run
